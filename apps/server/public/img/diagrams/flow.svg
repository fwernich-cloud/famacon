<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 250" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9fb3c8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="250" fill="#ffffff"/>

  <!-- connectors -->
  <line x1="212" y1="120" x2="256" y2="120" stroke="#9fb3c8" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="452" y1="120" x2="496" y2="120" stroke="#9fb3c8" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="692" y1="120" x2="736" y2="120" stroke="#9fb3c8" stroke-width="2" marker-end="url(#ah)"/>

  <!-- node 1: sensors -->
  <g>
    <rect x="24" y="66" width="188" height="108" rx="14" fill="#f4f8fb" stroke="#dbe3ea"/>
    <circle cx="64" cy="104" r="16" fill="#e3f2fb"/>
    <path d="M56 104 h16 M64 96 v16" stroke="#0ea5e9" stroke-width="2.4" stroke-linecap="round"/>
    <text x="92" y="100" fill="#0b1a2c" font-size="14" font-weight="700">Sensores</text>
    <text x="44" y="140" fill="#5a6b78" font-size="11.5">Nivel de tanque, golpes</text>
    <text x="44" y="157" fill="#5a6b78" font-size="11.5">del molino, corriente.</text>
  </g>
  <!-- node 2: gateway -->
  <g>
    <rect x="264" y="66" width="188" height="108" rx="14" fill="#f4f8fb" stroke="#dbe3ea"/>
    <g stroke="#0ea5e9" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M304 112 v-16"/><path d="M298 100 a10 10 0 0 1 12 0" /><path d="M294 106 a18 18 0 0 1 20 0"/>
    </g>
    <text x="332" y="100" fill="#0b1a2c" font-size="14" font-weight="700">Gateway 4G</text>
    <text x="284" y="140" fill="#5a6b78" font-size="11.5">Junta y envía por celular</text>
    <text x="284" y="157" fill="#5a6b78" font-size="11.5">cada pocas horas.</text>
  </g>
  <!-- node 3: server -->
  <g>
    <rect x="504" y="66" width="188" height="108" rx="14" fill="#f4f8fb" stroke="#dbe3ea"/>
    <rect x="544" y="90" width="30" height="28" rx="4" fill="none" stroke="#0ea5e9" stroke-width="2.4"/>
    <path d="M550 100 h18 M550 108 h12" stroke="#0ea5e9" stroke-width="2.2" stroke-linecap="round"/>
    <text x="586" y="100" fill="#0b1a2c" font-size="14" font-weight="700">Servidor</text>
    <text x="524" y="140" fill="#5a6b78" font-size="11.5">Cruza tanque × equipo</text>
    <text x="524" y="157" fill="#5a6b78" font-size="11.5">y aplica las reglas.</text>
  </g>
  <!-- node 4: whatsapp -->
  <g>
    <rect x="744" y="66" width="188" height="108" rx="14" fill="#eef8f1" stroke="#bfe4cb"/>
    <circle cx="784" cy="104" r="17" fill="#25d366"/>
    <path d="M776 110 a10 10 0 1 1 4 4 l-6 2 2-6 z" fill="#fff"/>
    <text x="812" y="100" fill="#0b1a2c" font-size="14" font-weight="700">WhatsApp</text>
    <text x="764" y="140" fill="#5a6b78" font-size="11.5">Aviso claro al productor,</text>
    <text x="764" y="157" fill="#5a6b78" font-size="11.5">solo cuando hace falta.</text>
  </g>

  <text x="24" y="40" fill="#0b1a2c" font-size="16" font-weight="700">Del sensor al WhatsApp</text>
  <text x="24" y="222" fill="#5a6b78" font-size="12">Cada lectura nace etiquetada con su productor, campo, sensor, fecha y hora — y queda guardada para siempre.</text>
</svg>
