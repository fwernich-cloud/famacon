<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" font-family="'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
  <style>
    .h{fill:#0b1a2c;font-weight:700}
    .col{fill:#5a6b78;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
    .v{font-weight:700}
    .s{fill:#5a6b78}
  </style>
  <rect x="0" y="0" width="680" height="470" fill="#ffffff"/>
  <!-- axes labels -->
  <text x="20" y="40" class="h" font-size="16">El cruce: tanque × equipo</text>
  <text x="20" y="60" class="s" font-size="12.5">Medir el tanque ya existe. El valor está en cruzarlo con el equipo que lo llena.</text>

  <!-- column headers -->
  <text x="305" y="108" class="col" font-size="11.5" text-anchor="middle">Tanque estable</text>
  <text x="540" y="108" class="col" font-size="11.5" text-anchor="middle">Tanque bajando</text>
  <!-- row headers -->
  <text x="24" y="205" class="col" font-size="11.5">Equipo</text>
  <text x="24" y="222" class="col" font-size="11.5">funcionando</text>
  <text x="24" y="355" class="col" font-size="11.5">Equipo</text>
  <text x="24" y="372" class="col" font-size="11.5">parado</text>

  <!-- cell 1,1 : ok -->
  <rect x="190" y="130" width="230" height="150" rx="12" fill="#eef8f1" stroke="#bfe4cb"/>
  <circle cx="212" cy="158" r="6" fill="#16a34a"/>
  <text x="228" y="163" class="v" font-size="15" fill="#15803d">Silencio</text>
  <text x="212" y="196" class="s" font-size="12.5">Todo en orden. El molino</text>
  <text x="212" y="214" class="s" font-size="12.5">repone y el tanque se sostiene.</text>

  <!-- cell 2,1 : ok -->
  <rect x="430" y="130" width="230" height="150" rx="12" fill="#eef8f1" stroke="#bfe4cb"/>
  <circle cx="452" cy="158" r="6" fill="#16a34a"/>
  <text x="468" y="163" class="v" font-size="15" fill="#15803d">Silencio</text>
  <text x="452" y="196" class="s" font-size="12.5">Normal: los animales toman</text>
  <text x="452" y="214" class="s" font-size="12.5">agua. No es una falla.</text>

  <!-- cell 1,2 : watch -->
  <rect x="190" y="290" width="230" height="150" rx="12" fill="#fdf5e8" stroke="#f0d6a6"/>
  <circle cx="212" cy="318" r="6" fill="#d97706"/>
  <text x="228" y="323" class="v" font-size="15" fill="#b45309">Atento</text>
  <text x="212" y="356" class="s" font-size="12.5">El equipo se detuvo pero el</text>
  <text x="212" y="374" class="s" font-size="12.5">tanque aún tiene reserva.</text>

  <!-- cell 2,2 : danger -->
  <rect x="430" y="290" width="230" height="150" rx="12" fill="#fdecec" stroke="#f3bcbc"/>
  <circle cx="452" cy="318" r="6" fill="#dc2626"/>
  <text x="468" y="323" class="v" font-size="15" fill="#b91c1c">Aviso urgente</text>
  <text x="452" y="356" class="s" font-size="12.5">El tanque se vacía sin</text>
  <text x="452" y="374" class="s" font-size="12.5">reposición. Hay que actuar.</text>
</svg>
