# Famacon Control — Mosquitto broker
# The field gateway publishes sensor batches here over 4G — via TLS on 8883.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type warning
log_type notice

# Keep the broker running as root so it can read the Let's Encrypt private key
# (the container already runs as root; this stops mosquitto from dropping to the
# unprivileged 'mosquitto' user, which can't read the 0600 privkey).
user root

# Auth required on every listener — no anonymous gateways.
allow_anonymous false
password_file /mosquitto/config/passwd

# ── Internal listener (Docker network only; NOT exposed to the internet) ──
# The app server connects here as mqtt://mosquitto:1883 inside the compose network.
listener 1883

# ── Public TLS listener — the field gateways connect here ──
# Reuses the domain's Let's Encrypt cert (famaconcontrol.com). Gateways connect to
# famaconcontrol.com:8883 with TLS + username/password. Encrypts credentials AND
# guarantees data integrity (no one can inject fake readings without the creds).
listener 8883
certfile /etc/letsencrypt/live/famaconcontrol.com/fullchain.pem
keyfile /etc/letsencrypt/live/famaconcontrol.com/privkey.pem
tls_version tlsv1.2
