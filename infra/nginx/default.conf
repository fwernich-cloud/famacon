# TLS config for famaconcontrol.com — reverse proxy to the Fastify app.
# Certificate obtained via Let's Encrypt (webroot). Renew with scripts/renew-tls.sh.

# HTTP → redirect to HTTPS (but keep serving the ACME challenge for renewals).
server {
    listen 80;
    server_name famaconcontrol.com www.famaconcontrol.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name famaconcontrol.com www.famaconcontrol.com;

    ssl_certificate     /etc/letsencrypt/live/famaconcontrol.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/famaconcontrol.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
