name: famacon-control

# Cap container logs so an unbounded json log can't quietly fill the disk (Hito 5 hardening).
# Each service keeps at most 3 × 10 MB of logs.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # localhost only — never exposed publicly
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - mosquittodata:/mosquitto/data
      - certbot-conf:/etc/letsencrypt:ro   # read the domain's LE cert for TLS on 8883
    ports:
      - "8883:8883"   # MQTT over TLS — the field gateways connect here (auth required); 1883 stays internal-only
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 -u ${MQTT_USER} -P ${MQTT_PASSWORD} || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    volumes:
      - ./apps/server/public:/app/public:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mosquitto: { condition: service_started }
    ports:
      - "127.0.0.1:3000:3000"   # behind nginx
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      server: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt

  simulator:
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    restart: "no"
    logging: *default-logging
    profiles: ["sim"]        # opt-in: `docker compose --profile sim up simulator`
    env_file: .env
    depends_on:
      server: { condition: service_started }

volumes:
  pgdata:
  redisdata:
  mosquittodata:
  certbot-www:
  certbot-conf:
